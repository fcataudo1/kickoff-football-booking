<nav class="navbar navbar-expand-lg navbar-dark kickoff-navbar shadow-sm">

    <div class="container">

        <!-- LOGO -->
        <a class="navbar-brand" href="#home">
            <img
                src="assets/logo.png"
                alt="Logo KickOff"
                class="logo">
        </a>


        <!-- MENU MOBILE -->
        <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#navbarMenu"
            aria-controls="navbarMenu"
            aria-expanded="false"
            aria-label="Apri menu">

            <span class="navbar-toggler-icon"></span>

        </button>


        <!-- MENU -->
        <div
            class="collapse navbar-collapse"
            id="navbarMenu">


            <!-- LINK PRINCIPALI -->
            <ul class="navbar-nav mx-auto mb-2 mb-lg-0 gap-lg-2">

                <li class="nav-item">

                    <a
                        class="nav-link active"
                        href="#home">

                        <i class="bi bi-house-door me-1"></i>
                        Home

                    </a>

                </li>


                <li class="nav-item">

                    <a
                        class="nav-link"
                        href="#services">

                        <i class="bi bi-grid me-1"></i>
                        Campi

                    </a>

                </li>


                <li class="nav-item">

                    <a
                        class="nav-link"
                        href="#booking">

                        <i class="bi bi-calendar-plus me-1"></i>
                        Prenota

                    </a>

                </li>


                <li class="nav-item">

                    <a
                        class="nav-link"
                        href="#why-kickoff">

                        <i class="bi bi-patch-check me-1"></i>
                        Perché noi

                    </a>

                </li>


                <li class="nav-item">

                    <a
                        class="nav-link"
                        href="#contact">

                        <i class="bi bi-envelope me-1"></i>
                        Contatti

                    </a>

                </li>

            </ul>


            <!-- ============================== -->
            <!-- AREA UTENTE -->
            <!-- ============================== -->

            <div class="user-area">


                @if (isLoggedIn) {


                    <!-- CLIENTE -->

                    @if (isCliente) {

                        <button
                            type="button"
                            class="user-menu-link"
                            (click)="openMyReservations()">

                            <i class="bi bi-calendar-check"></i>

                            <span>
                                Le mie prenotazioni
                            </span>

                        </button>

                    }


                    <!-- RECEPTIONIST -->

                    @if (isReceptionist) {

                        <button
                            type="button"
                            class="user-menu-link"
                            (click)="openReceptionistReservations()">

                            <i class="bi bi-calendar2-week"></i>

                            <span>
                                Prenotazioni
                            </span>

                        </button>

                    }


                    <!-- ADMIN -->


                    @if (isAdmin) {

                        <button
                        type="button"
                        class="user-menu-link"
                        (click)="openAdminUsers()">

                        <i class="bi bi-people"></i>

                        <span>
                            Utenti
                        </span>

                    </button>

                    }


                    <!-- ============================== -->
                    <!-- PROFILO -->
                    <!-- ============================== -->

                    <div class="dropdown">

                        <button
                            class="user-profile dropdown-toggle"
                            type="button"
                            data-bs-toggle="dropdown"
                            aria-expanded="false">

                            <span class="user-avatar">

                                <i class="bi bi-person-fill"></i>

                            </span>

                            <span class="user-info">

                                <strong>
                                    {{ userName }}
                                </strong>

                                <small>
                                    {{ roleLabel }}
                                </small>

                            </span>

                        </button>


                        <ul
                            class="dropdown-menu dropdown-menu-end shadow">

                            <li>

                                <h6 class="dropdown-header">
                                    Account
                                </h6>

                            </li>


                            <!-- PROFILO -->

                            <li>

                                <button
                                    type="button"
                                    class="dropdown-item"
                                    (click)="openProfile()">

                                    <i class="bi bi-person me-2"></i>

                                    Profilo

                                </button>

                            </li>


                            <li>

                                <hr class="dropdown-divider">

                            </li>


                            <!-- ESCI -->

                            <li>

                                <button
                                    type="button"
                                    class="dropdown-item logout-item"
                                    (click)="openLogoutConfirm()">

                                    <i class="bi bi-box-arrow-right me-2"></i>

                                    Esci

                                </button>

                            </li>

                        </ul>

                    </div>


                } @else {


                    <!-- ============================== -->
                    <!-- UTENTE NON AUTENTICATO -->
                    <!-- ============================== -->

                    <div class="auth-buttons">

                        <button
                            type="button"
                            class="btn btn-login"
                            (click)="openLogin()">

                            <i class="bi bi-box-arrow-in-right me-1"></i>

                            Login

                        </button>


                        <button
                            type="button"
                            class="btn btn-register"
                            (click)="openRegister()">

                            <i class="bi bi-person-plus me-1"></i>

                            Registrati

                        </button>

                    </div>

                }

            </div>


            <!-- ============================== -->
            <!-- SOCIAL -->
            <!-- ============================== -->

            <div class="social d-none d-xl-flex">

                <span class="social-icon instagram">
                    <i class="bi bi-instagram"></i>
                </span>

                <span class="social-icon facebook">
                    <i class="bi bi-facebook"></i>
                </span>

                <span class="social-icon tiktok">
                    <i class="bi bi-tiktok"></i>
                </span>

            </div>

        </div>

    </div>

</nav>


<!-- ================================================= -->
<!-- POPUP CONFERMA LOGOUT -->
<!-- ================================================= -->

@if (showLogoutConfirm) {

    <div
        class="logout-overlay"
        (click)="cancelLogout()">

        <div
            class="logout-modal"
            (click)="$event.stopPropagation()">

            <!-- ICONA -->

            <div class="logout-icon">

                <i class="bi bi-box-arrow-right"></i>

            </div>


            <!-- TITOLO -->

            <h4>
                Confermi di voler uscire?
            </h4>


            <!-- TESTO -->

            <p>
                Verrai disconnesso dal tuo account.
            </p>


            <!-- AZIONI -->

            <div class="logout-actions">

                <button
                    type="button"
                    class="btn-cancel-logout"
                    (click)="cancelLogout()">

                    No

                </button>


                <button
                    type="button"
                    class="btn-confirm-logout"
                    (click)="confirmLogout()">

                    Sì, esci

                </button>

            </div>

        </div>

    </div>

}
