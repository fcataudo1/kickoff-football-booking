<section class="video-section">

    <video
        #videoPlayer
        autoplay
        muted
        loop
        playsinline>

        <source
            src="assets/partita.mp4"
            type="video/mp4">

    </video>


    <!-- OVERLAY -->

    <div class="video-overlay"></div>


    <!-- CONTENUTO -->

    <div class="container">

        <div class="video-content text-center text-white">

            <span class="video-badge">

                <i class="bi bi-play-circle-fill"></i>

                VIVI LA PARTITA

            </span>


            <h2>

                Il campo dove
                <br>

                <span>nascono le sfide.</span>

            </h2>


            <p>

                Accendi la passione, riunisci la tua squadra
                e vivi ogni partita fino all'ultimo minuto.

            </p>


            <a
                href="#booking"
                class="video-button">

                <i class="bi bi-calendar-plus"></i>

                Prenota il tuo campo

            </a>

        </div>

    </div>

</section>
