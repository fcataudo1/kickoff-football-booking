<app-navbar
    (loginClick)="openLogin()"
    (registerClick)="openRegister()"
    (myReservationsClick)="openMyReservations()"
    (receptionistReservationsClick)="openReceptionistReservations()"
    (profileClick)="openProfile()"
    (adminUsersClick)="openAdminUsers()">
</app-navbar>


<app-hero></app-hero>

<app-booking></app-booking>

<app-services></app-services>

<app-video-section></app-video-section>

<app-why-kickoff></app-why-kickoff>

<app-stats></app-stats>

<app-contact></app-contact>

<app-footer></app-footer>


<!-- ========================= -->
<!-- LOGIN -->
<!-- ========================= -->

@if (showLogin) {

    <app-login
        (close)="closeLogin()">
    </app-login>

}


<!-- ========================= -->
<!-- REGISTRAZIONE -->
<!-- ========================= -->

@if (showRegister) {

    <app-register
        (close)="closeRegister()"
        (login)="openLoginFromRegister()">
    </app-register>

}


<!-- ========================= -->
<!-- MIE PRENOTAZIONI -->
<!-- ========================= -->

@if (showMyReservations) {

    <app-my-reservations
        (close)="closeMyReservations()">
    </app-my-reservations>

}


<!-- ========================= -->
<!-- PRENOTAZIONI RECEPTIONIST -->
<!-- ========================= -->

@if (showReceptionistReservations) {

    <app-receptionist-reservations
        (close)="closeReceptionistReservations()">
    </app-receptionist-reservations>

}


<!-- ========================= -->
<!-- GESTIONE UTENTI ADMIN -->
<!-- ========================= -->

@if (showAdminUsers) {

    <app-admin-users
        (close)="closeAdminUsers()">
    </app-admin-users>

}


<!-- ========================= -->
<!-- PROFILO -->
<!-- ========================= -->

@if (showProfile) {

    <app-profile
        (close)="closeProfile()">
    </app-profile>

}

<!-- ========================= -->
<!-- TORNA SU -->
<!-- ========================= -->

@if (showBackToTop) {

    <button
        type="button"
        class="back-to-top"
        (click)="scrollToTop()"
        aria-label="Torna su">

        <i class="bi bi-arrow-up"></i>

    </button>

}
