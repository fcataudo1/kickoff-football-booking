<div class="card shadow mt-4 reservation-card">


<div class="card-header bg-success text-white">

<h4>
<i class="bi bi-calendar-check"></i>
Completa prenotazione
</h4>

</div>



<div class="card-body">


<div class="mb-3">

<label>
Nome e Cognome
</label>

<input
class="form-control"
type="text"
[(ngModel)]="reservation.customerName">

</div>



<div class="mb-3">

<label>
Telefono
</label>

<input
class="form-control"
type="text"
[(ngModel)]="reservation.customerPhone">

</div>



<div class="mb-3">

<label>
Email
</label>

<input
class="form-control"
type="email"
[(ngModel)]="reservation.customerEmail">

</div>



<div class="mb-3">

<label>
Data partita
</label>

<input
type="date"
class="form-control"
[ngModel]="reservation.reservationDate"
readonly>
</div>



<div class="mb-3">

<label>
Orario
</label>


<input
class="form-control"
[ngModel]="reservation.startTime"
readonly>

</div>



<button
class="btn btn-success w-100"
(click)="createReservation()">

Conferma prenotazione

</button>



</div>


</div>
